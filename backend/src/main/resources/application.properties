spring.application.name=el-bajon-del-vicho-backend

# Servidor
server.port=${SERVER_PORT:8081}

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/el_bajon_del_vicho_desarrollo
spring.datasource.username=vicho_app
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}

# Cookie de renovacion (desarrollo local HTTP)
app.auth.cookie-secure=${COOKIE_SECURE:false}