spring.application.name=microservicio-pedidos

# Servidor
server.port=${SERVER_PORT:8083}

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/el_bajon_del_vicho_pedidos
spring.datasource.username=pedidos_app
spring.datasource.password=${PEDIDOS_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT compartido con los otros servicios
app.jwt.secret=${JWT_SECRET}

# Backend principal - catálogo
catalogo.base-url=${CATALOGO_BASE_URL:http://localhost:8081}