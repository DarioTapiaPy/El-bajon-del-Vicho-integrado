# Base H2 exclusiva para pruebas
spring.datasource.url=jdbc:h2:mem:reservas_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear tablas temporalmente en H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Desactivar inicializacion SQL adicional
spring.sql.init.mode=never

# Clave fija exclusiva para pruebas automatizadas
# No utilizar como secreto del entorno real
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=