
# Nombre del microservicio
spring.application.name=microservicio-reservas

# Puerto independiente
server.port=${SERVER_PORT:8082}

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/el_bajon_del_vicho_reservas
spring.datasource.username=reservas_app
spring.datasource.password=${RESERVAS_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}